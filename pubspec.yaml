name: booking
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  shared_preferences: ^2.2.2
  flutter:
    sdk: flutter
  intl: ^0.18.1
  http: ^0.13.6
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.0.0
  app_links: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/carwash.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icon/
